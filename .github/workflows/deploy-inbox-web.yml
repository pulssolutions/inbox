name: Deploy Inbox Web

# Also rebuilds the app from the stack outputs and re-registers the
# CloudFront origin with Cognito.
#
# Thin caller: the logic lives in _deploy.yml so the seven stack workflows
# cannot drift apart. Account and region come from the deployment profile.

on:
  push:
    branches: [main]
    paths:
      - aws/web/inbox/**
      - .github/workflows/deploy-inbox-web.yml
      - .github/workflows/_deploy.yml
      - scripts/**
      - deployments/**
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, www]
      profile:
        description: Deployment profile (blank uses the DEPLOY_PROFILE variable)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      stack: web
      environment: ${{ inputs.environment || 'dev' }}
      profile: ${{ inputs.profile }}
    secrets: inherit
