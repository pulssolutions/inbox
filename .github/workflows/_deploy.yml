name: _deploy

# Shared engine for the per-stack deploy workflows. Not run directly.
#
# Each stack gets its own workflow with its own path filter, but the logic lives
# here once instead of being copied into seven files that then drift apart.
#
# Which AWS account is deployed to comes from the deployment profile in
# deployments/, because a profile IS an account. The role is taken from the
# AWS_DEPLOY_ROLE_ARN repository variable when set, and otherwise derived from
# the profile - so a deployment works either with the variable configured or
# with nothing but its profile.

on:
  workflow_call:
    inputs:
      stack:
        description: Stack to deploy (account, billing, shared, inbox, inbox-parse, inbox-mail, web)
        required: true
        type: string
      environment:
        description: Environment; blank derives it from the branch
        required: false
        default: ''
        type: string
      profile:
        description: Deployment profile; defaults to the DEPLOY_PROFILE variable
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Upstream is a repository to copy, not to deploy from: with no profile
    # configured there is nothing to deploy TO. Skip, rather than fail red on
    # every push to a repo that is working exactly as intended.
    if: vars.DEPLOY_PROFILE != '' || vars.DEPLOY_PROFILE_JSON != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve profile and role
        id: cfg
        env:
          # A fork sets this repository variable instead of committing a
          # profile, so it has no tracked configuration to conflict on when it
          # merges from upstream. Empty here means the committed file is used.
          DEPLOY_PROFILE_JSON: ${{ vars.DEPLOY_PROFILE_JSON }}
        run: |
          PROFILE="${{ inputs.profile }}"
          [ -n "$PROFILE" ] || PROFILE="${{ vars.DEPLOY_PROFILE }}"
          # DEPLOY_PROFILE_JSON already names itself, so a deployment that
          # configures itself entirely through that one variable needs no
          # second variable repeating the name.
          if [ -z "$PROFILE" ] && [ -n "$DEPLOY_PROFILE_JSON" ]; then
            PROFILE=$(node -e 'process.stdout.write(JSON.parse(process.env.DEPLOY_PROFILE_JSON).name || "")')
          fi
          if [ -z "$PROFILE" ]; then
            echo "Set DEPLOY_PROFILE (or DEPLOY_PROFILE_JSON) to name your deployment." >&2
            exit 1
          fi
          node scripts/profile.mjs "$PROFILE" --check

          # The repository variable wins when set; otherwise the role name is
          # derived from the profile, which is where it comes from by default.
          ROLE="${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          [ -n "$ROLE" ] || ROLE=$(node scripts/profile.mjs "$PROFILE" --role)

          # A push decides by branch, a dispatch says so outright. The rule
          # lives here alone, so five thin callers cannot disagree about which
          # branch means production.
          ENVIRONMENT="${{ inputs.environment }}"
          if [ -z "$ENVIRONMENT" ]; then
            case "${{ github.ref_name }}" in
              production) ENVIRONMENT=www ;;
              *)          ENVIRONMENT=dev ;;
            esac
          fi

          echo "environment=$ENVIRONMENT"   >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE"           >> "$GITHUB_OUTPUT"
          echo "role=$ROLE"                 >> "$GITHUB_OUTPUT"
          echo "region=$(node scripts/profile.mjs "$PROFILE" --region)" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ inputs.stack }} for profile $PROFILE ($ENVIRONMENT)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.cfg.outputs.region }}
          role-to-assume: ${{ steps.cfg.outputs.role }}

      # Only the service stack ships built code, so only it needs the suites
      # run here; everything else is validated by validate.yml on the PR.
      - name: Install and test the service
        if: inputs.stack == 'inbox'
        working-directory: aws/services/inbox
        run: |
          npm ci
          (cd pretoken && npm ci) && (cd presignup && npm ci)
          npm run lint
          npm test
          npm run test:integration
          (cd pretoken && npm test) && (cd presignup && npm test)

      - name: Deploy
        env:
          DEPLOY_PROFILE_JSON: ${{ vars.DEPLOY_PROFILE_JSON }}
        run: |
          node scripts/deploy.mjs "${{ steps.cfg.outputs.profile }}" \
            --env "${{ steps.cfg.outputs.environment }}" \
            --only "${{ inputs.stack }}"
