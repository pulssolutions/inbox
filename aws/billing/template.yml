AWSTemplateFormatVersion: "2010-09-09"
Description: Billing and budget alerts. Deploy this stack in us-east-1.

Parameters:
  ProjectPrefix:
    Type: String
    Default: inbox
  NotificationEmail:
    Type: String
  MonthlyBudgetAmount:
    Type: Number
    Default: 10
    Description: Monthly AWS budget alert amount in USD.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectPrefix}-monthly-budget"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  BudgetName:
    Value: !Sub "${ProjectPrefix}-monthly-budget"
