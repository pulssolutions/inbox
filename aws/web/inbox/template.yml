AWSTemplateFormatVersion: "2010-09-09"
Description: Inbox agent web app - private S3 bucket behind CloudFront

Parameters:
  ProjectPrefix:
    Type: String
    Default: inbox
  Environment:
    Type: String
    AllowedValues:
      - dev
      - www
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Custom domain for the app. Empty serves it on the CloudFront
      *.cloudfront.net name with the default certificate. CloudFront rather than
      a plain S3 website endpoint even then, for two reasons: the bucket stays
      private behind Origin Access Control, and Cognito refuses non-HTTPS
      callback URLs, which an S3 website endpoint cannot offer.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Empty means the DNS record is created by hand, or not at all.
  CloudFrontCertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM certificate. Required only with a custom domain.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasDns: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectPrefix}-inbox-web-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix
        - Key: Environment
          Value: !Ref Environment

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectPrefix}-inbox-web-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      # CloudFrontCertificateArn is intentionally empty when no custom domain is
      # configured, and the property referencing it sits inside !If HasDomain -
      # a condition cfn-lint does not follow, so it reads "" as a malformed ARN.
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectPrefix} inbox web ${Environment}"
        Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If
          - HasDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: WebBucketOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  WebDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontDistributionId:
    Value: !Ref WebDistribution
  CloudFrontDomainName:
    Value: !GetAtt WebDistribution.DomainName
  WebUrl:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${WebDistribution.DomainName}"
